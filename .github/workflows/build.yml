name: Build Nava APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q Nava-Android-Source.zip -d source

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;34.0.0"

      - name: Build APK
        working-directory: source/Nava
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Nava-APK
          path: source/Nava/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
